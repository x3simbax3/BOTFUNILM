  name: CI

  on:
    push:
      branches:
        - master
    pull_request:
      branches:
        - master
    workflow_dispatch:

  permissions:
    contents: read

  concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

  jobs:
    check:
      name: check
      runs-on: ubuntu-latest
      timeout-minutes: 20

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Prepare safe configuration
          run: cp .env.example config/.env

        - name: Install Atlas
          uses: ariga/setup-atlas@v0

        - name: Run project checks
          run: make check TEST_PROCESSES=1
