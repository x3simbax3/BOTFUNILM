[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botfunilm"
version = "0.1.0"
description = "Telegram bot for tracking movies, anime, and TV series"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiogram[redis]==3.30.0",
    "aiosqlite==0.21.0",
    "openpyxl==3.1.5",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
    "ruff==0.15.22",
]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires local service containers",
    "load: resource-intensive concurrency checks",
]

[tool.coverage.run]
branch = true
source = ["src", "config"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/lang/__init__.py" = ["E402"]
"src/lang/ru/__init__.py" = ["F403"]
