[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botfunilm"
version = "0.1.0"
description = "Telegram bot for tracking movies, anime, and TV series"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "aiogram==3.30.0",
    "aiosqlite==0.21.0",
    "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
]

[tool.setuptools.packages.find]
include = ["config*", "src*"]

[tool.uv]
cache-dir = ".uv-cache"

[tool.pytest.ini_options]
testpaths = ["tests"]
